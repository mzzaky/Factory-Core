# ============================================================
#  Company Configuration — Virtual Entities
# ============================================================
#  These companies act as NPC buyers that generate product
#  requests (events) for players to fulfill.
#
#  FORMAT:
#    <company_id>:
#      name: "Display name of the company"
#      description: "Brief description of what this company does"
#      icon: <Bukkit Material>
#      industry: "Industry category"
#      ceo: "CEO name (flavor text)"
#      headquarters: "HQ location (flavor text)"
#      reputation: <1-5>
#      lore:
#        - "Additional lore lines"
#        - "shown in company tooltip"
# ============================================================

