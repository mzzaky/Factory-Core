# ============================================================
#  FactoryCore - Distribution Center: Company Configuration
#  File: company.yml
# ============================================================
#
#  This file defines virtual company entities that act as
#  consumers in the Distribution Center system. Companies
#  will request materials/resources from players via events.
#
#  FORMAT:
#    <company_id>:
#      name: "Display name of the company"
#      description: "Brief description of what this company does"
#      icon: <Bukkit Material>        # Icon shown in GUI
#      industry: "Industry category"
#      ceo: "CEO name (flavor text)"
#      headquarters: "HQ location (flavor text)"
#      reputation: <1-5>              # Star rating displayed in GUI
#      lore:
#        - "Additional lore lines"
#        - "shown in company tooltip"
#
# ============================================================

