# FactoryCore Configuration
# Version: 1.21.4
# Author: aithor

# Database settings
database:
  type: YAML # YAML or MySQL
  mysql:
    host: localhost
    port: 3306
    database: factorycore
    username: root
    password: password

# Backup settings
backup:
  # Maximum number of backups to keep (oldest are deleted when exceeded)
  max-backups: 10
  # Automatic backup configuration
  auto-backup:
    enabled: false # Set to true to enable automatic backups
    interval-ticks: 1728000 # 24 hours (20 ticks * 60s * 60m * 24h)

# Tax settings
tax:
  enabled: true
  rate: 5.0 # Percentage of factory price
  interval-ticks: 41472000 # 1 days in Real Life
  level-multiplier: 2.5 # Additional tax per level (%)
  # NEW: Tax Center settings
  due-days: 7 # Days until tax is considered overdue
  late-fee-rate: 50.0 # Late fee percentage when overdue
  notify-on-assessment: true # Notify players when tax is assessed
  notify-on-overdue: true # Notify players when tax becomes overdue

# Salary settings
salary:
  enabled: true
  rate: 1.0 # Percentage of factory price
  interval-ticks: 41472000 # 1 day in Real Life

# ==================== NEW: MARKETPLACE SETTINGS ====================
marketplace:
  enabled: true
  # Tax rate on marketplace sales (deducted from seller)
  tax-rate: 5.0
  # Maximum listings per player
  max-listings-per-player: 3
  # Listing expiration time in hours
  listing-expiration-hours: 8
  # Minimum price per unit
  min-price: 0.01
  # Maximum price per unit
  max-price: 1000000.0

# Factory settings
factory:
  max-level: 5
  base-storage-slots: 9 # Fixed storage slots for input & output storage (no longer scales with level)
  sell-price-multiplier: 0.5 # 50% of buy price
  max-factories-per-player: 3 # Max factories a player can own (bypass: factorycore.bypass.factory-limit)

  # Production bonuses per level
  level-bonuses:
    cost-reduction: 5.0 # % reduction per level
    time-reduction: 10.0 # % reduction per level
    slots-per-level: 9 # additional slots per level for output storage

  # Resource requirements to upgrade to each level
  # Keys are the target level (e.g. '2' = upgrading FROM level 1 TO level 2)
  # You can use standard resource IDs (e.g. basic_gear) or vanilla materials
  # using the 'vanilla:MATERIAL_NAME' prefix (e.g. vanilla:IRON_INGOT).
  upgrade-requirements:
    2:
      basic_gear: 5
    3:
      basic_gear: 10
      advanced_gear: 5
    4:
      basic_gear: 15
      advanced_gear: 10
    5:
      basic_gear: 20
      advanced_gear: 20

  # Upgrade duration in seconds per target level
  upgrade-time:
    2: 60
    3: 120
    4: 300
    5: 600

# Factory types configuration
factory-types:

# TIER I
  smeltery:
    name: "§aSmeltery"
    description: "§7Processes vanilla materials into raw resources"
    base-price: 1000.0
    icon: BLAST_FURNACE

# TIER II
  steel_mill:
    name: "§6Steel Mill"
    description: "§7Transforms raw resources into advanced resources"
    base-price: 25000.0
    icon: IRON_BLOCK
    
  refinery:
    name: "§eRefinery"
    description: "§7Produces fuel for factories"
    base-price: 25000.0
    icon: FURNACE

  workshop:
    name: "§bWorkshop"
    description: "§7Produces machine parts"
    base-price: 25000.0
    icon: ANVIL

# TIER III
  military_factory:
    name: "§5Military Factory"
    description: "§7Produces military equipment"
    base-price: 100000.0
    icon: TNT
  electronics_assembly:
    name: "§5Electronic Assembly Factory"
    description: "§7Produces consumer & enterprise electronics"
    base-price: 125000.0
    icon: COMPARATOR
  automotive_plant:
    name: "§5Automotive Plant Factory"
    description: "§7Produces vehicle components — heavy industry"
    base-price: 150000.0
    icon: MINECART
  aerospace_foundry:
    name: "§5Aerospace Foundry Factory"
    description: "§7Produces aircraft & spacecraft components"
    base-price: 250000.0
    icon: ENDER_CHEST

# ==================== PLAYER FACTORY CREATION ====================
# Allows players to create their own factory regions without admin or WorldGuard
player-factory:
  enabled: true
  # Worlds where players are allowed to create factories
  # Leave empty to allow all worlds
  allowed-worlds:
    - world
  # Region size: radius extends in each horizontal direction from player position
  region-radius: 3
  # Region height above and below the player
  region-height-up: 5
  region-height-down: 5
  # Creation prices per factory type (overrides base-price for player creation)
  creation-prices:
    smeltery: 1000.0
    steel_mill: 25000.0
    refinery: 25000.0
    workshop: 25000.0
    advanced_factory: 250000.0
  # Region protection settings
  protection:
    enabled: true
  # Border visualization particle
  border-particle: FLAME
  border-particle-spacing: 3.5
  # Interval in ticks for border particle display (20 = 1 second)
  border-particle-interval: 10

# Notification settings
notifications:
  enabled: true
  sound:
    enabled: true
    production-complete: ENTITY_PLAYER_LEVELUP
    invoice-created: BLOCK_NOTE_BLOCK_PLING
    level-up: ENTITY_PLAYER_LEVELUP
    factory-upgrade: ENTITY_PLAYER_LEVELUP
    # NEW: Additional sounds
    distribution-request: BLOCK_NOTE_BLOCK_BELL
    tax-due: BLOCK_NOTE_BLOCK_BASS
    marketplace-sale: ENTITY_EXPERIENCE_ORB_PICKUP
    factory-created: ENTITY_PLAYER_LEVELUP
    border-toggle: BLOCK_NOTE_BLOCK_PLING
  titles:
    enabled: true
    fade-in: 10
    stay: 40
    fade-out: 10

# GUI settings
gui:
  update-interval: 20 # ticks
  border-item: BLACK_STAINED_GLASS_PANE
  back-item: ARROW
  close-item: BARRIER
  confirm-item: GREEN_WOOL
  cancel-item: RED_WOOL
  # NEW: Hub GUI settings
  hub:
    show-player-head: true
    show-quick-stats: true
    title: "§6§lFactoryCore §8- §eMain Hub"

# ==================== NEW: DISTRIBUTION CENTER SETTINGS ====================
distribution:
  enabled: true
  bossbar:
    color: BLUE
    style: SOLID
    title: "{event_name} &8- &e{time}"
  # Tax rate deducted from distribution center payouts (%)
  tax_distribution_rate: 25.0
  # Maximum number of active requests per player
  max-active-requests: 3
  # Interval in ticks between distribution event spawn checks (6000 = 5 minutes)
  spawn-interval-ticks: 6000
  # Minimum time between new request spawns per player (in seconds)
  min-spawn-cooldown: 300
  # Whether to notify all online players when a new request appears
  broadcast-new-requests: false
  # Allow requests to spawn while player is offline
  allow-offline-spawning: false

# Debug settings
debug:
  enabled: false
  gui-debug: false # Enable detailed GUI click debugging

# Logging settings
logging:
  enabled: true
  log-admin-commands: true
  log-transactions: true
  log-production: true
  log-invoices: true
  file-name: "factorycore.log"
  max-file-size: 10485760 # 10MB in bytes
  # NEW: Additional logging
  log-marketplace: true
  log-taxes: true

# Production settings
production:
  allow-offline-production: false
  max-queue: 5
  show-bossbar: true
  bossbar-color: BLUE
  bossbar-style: SOLID

# Placeholder settings
placeholders:
  update-interval: 100 # ticks

# ==================== DAILY QUEST SETTINGS ====================
daily-quest:
  # Bonus reward when ALL daily quests are completed
  all-complete-bonus:
    enabled: true
    exp: 500
    money: 25000.0

  # Sound effects for quest completion
  sound:
    quest-complete: ENTITY_PLAYER_LEVELUP
    quest-complete-volume: 1.0
    quest-complete-pitch: 1.5
    all-complete: UI_TOAST_CHALLENGE_COMPLETE
    all-complete-volume: 1.0
    all-complete-pitch: 1.0

  # Notification settings
  notifications:
    toast-fade-in: 10
    toast-stay: 60
    toast-fade-out: 20