# ============================================================
#  Event Configuration — Company Product Requests
# ============================================================
#  Virtual companies request resources from players.
#  Pricing is calibrated to suggested_price values in resources.yml
#  with a 10-25% markup to provide fair profit without breaking economy.
#
#  Tier Guide:
#    RAW orders       → short time, low payout
#    ADVANCED/PARTS   → medium time, medium payout
#    FINAL products   → long time, high payout
#    MIXED orders     → varied, balanced payout
#
#  FORMAT:
#    <event_id>:
#      name: "Display name of the request"
#      lore:
#        - "Description line 1"
#        - "Description line 2"
#      chance: <0.0-100.0>
#      time: <seconds>
#      company: <company_id>
#      demand:
#        - <resource_id> <value>
#      price_offer: <amount>
#      bonus: <multiplier>
#      bonus_condition: <percentage>
# ============================================================

