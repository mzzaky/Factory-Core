# ============================================================
#  FactoryCore - Distribution Center: Event Configuration
#  File: event.yml
# ============================================================
#
#  This file defines request events for the Distribution Center.
#  The system randomly selects events based on their chance value
#  and presents them to players as material delivery requests.
#
#  FORMAT:
#    <event_id>:
#      name: "Display name of the request"
#      lore:
#        - "Description line 1"
#        - "Description line 2"
#      chance: <0.0-100.0>            # Chance this event is selected (weight)
#      time: <seconds>                # Time limit to complete the request
#      company: <company_id>          # Company from company.yml
#      demand:                        # List of resource IDs from resources.yml
#        - <resource_id> <value>
#        - <resource_id> <value>
#      price_offer: <amount>          # Base money reward
#      bonus: <multiplier>            # Bonus multiplier (e.g. 1.5 = 150%)
#      bonus_condition: <percentage>  # % of time remaining to qualify for bonus
#      command-on-appear:             # Commands run when request appears
#        - "<command>"
#      command-on-complete:           # Commands run when player completes request
#        - "<command>"                # Use %player% for player name placeholder
#      command-on-leave:              # Commands run when event expires (not fulfilled)
#        - "<command>"                # Use %player% for player name placeholder
#
# ============================================================
# ECONOMY BALANCING NOTES:
#   price_offer = (suggested_price × qty) × multiplier
#   - BASIC  requests: multiplier 1.2–1.3  (slightly above market)
#   - INTER  requests: multiplier 1.3–1.4
#   - RARE   requests: multiplier 1.4–1.5
#   - ELITE  requests: multiplier 1.5–1.6
#   - MULTI  requests: multiplier 1.2–1.4  (logistic bonus pooled)
#
#   Suggested prices used (from resources.yml):
#     industrial_iron_ore=12, industrial_coal_ore=8, industrial_copper_ore=15, industrial_redstone_dust=12,
#     industrial_gold_ore=40, industrial_diamond_ore=150
#     steel_ingot=80, refined_copper=60, gold_alloy=180, carbon_fiber=250
#     advanced_weapon=3500, advanced_armor=3200, electronic_component=2000, luxury_item=7000
#     basic_fuel=18, refined_fuel=50, premium_fuel=120
#     basic_gear=25, advanced_gear=90, engine_part=180, circuit_board=350, hydraulic_system=500
# ============================================================

