    factory-type: smeltery
    production-time: 120
    money-cost: 12.0
    inputs:
      vanilla:REDSTONE_ORE: 4      # 4x Redstone Ore block
    outputs:
      industrial_redstone_dust: 4            # 4 × $12 = $48 - 12 = profit $36
    icon: REDSTONE_ORE

  smelt_deepslate_iron:
