# Recipes Configuration
# Format: recipe_id -> inputs & outputs
# money-cost: money deducted from the player each time production starts (0 = free)
# disable-item-output: true (optional) will prevent any items from going to the output storage, useful if you only want to give rewards via console-commands
#
# ==================== VANILLA INPUT PREFIX ====================
# For Smeltery recipes, input keys prefixed with "vanilla:" refer to plain
# vanilla Minecraft materials obtained from the world (e.g. "vanilla:IRON_ORE").
# The engine matches these by Bukkit Material name rather than a plugin resource ID,
# so custom-model-data items with the same material are NOT accepted as substitutes.
# All other input keys (no prefix) refer to plugin-tracked resources in resources.yml.

recipes:
  # ==================== SMELTERY RECIPES ====================
  # The Smeltery is the ENTRY-POINT factory: it accepts real vanilla materials
  # mined / gathered by players and converts them into plugin-tracked raw resources.
  #
  # Balancing note:
  #   money-cost  = small operating fee (~5-15% of output value)
  #   eco reward  = ~10% of output value (suggested_price × qty_output)
  #   Output value reference → resources.yml suggested_price

  smelt_industrial_iron_ore:
    name: "§fIron Ore Processing"
    factory-type: smeltery
    production-time: 120 # seconds
    money-cost: 15.0
    inputs:
      vanilla:IRON_ORE: 4          # 4x Iron Ore block (mined from world)
      vanilla:COAL: 2              # 2x Coal (natural fuel)
    outputs:
      industrial_iron_ore: 4                  # industrial_iron_ore (4 × $12 = $48 - 15 = profit $33)
    icon: IRON_ORE

  smelt_coal_ore:
    name: "§8Coal Ore Processing"
    factory-type: smeltery
    production-time: 90
    money-cost: 8.0
    inputs:
      vanilla:COAL_ORE: 4          # 4x Coal Ore block
    outputs:
      industrial_coal_ore: 4                  # 4 × $8 = $32 - 8 = profit $24
    icon: COAL_ORE

  smelt_industrial_copper_ore:
    name: "§6Copper Ore Processing"
    factory-type: smeltery
    production-time: 120
    money-cost: 18.0
    inputs:
      vanilla:COPPER_ORE: 4        # 4x Copper Ore block
      vanilla:COAL: 2
    outputs:
      industrial_copper_ore: 4                # 4 × $15 = $60 - 18 = profit $42
    icon: COPPER_ORE

  smelt_industrial_gold_ore:
    name: "§eGold Ore Processing"
    factory-type: smeltery
    production-time: 180
    money-cost: 40.0
    inputs:
      vanilla:GOLD_ORE: 4          # 4x Gold Ore block
      vanilla:COAL: 4
    outputs:
      industrial_gold_ore: 4                  # 4 × $40 = $160 - 40 = profit $120
    icon: GOLD_ORE

  smelt_industrial_diamond_ore:
    name: "§bDiamond Ore Processing"
    factory-type: smeltery
    production-time: 300
    money-cost: 100.0
    inputs:
      vanilla:DIAMOND_ORE: 2       # 2x Diamond Ore block
      vanilla:COAL: 6
    outputs:
      industrial_diamond_ore: 2               # 2 × $150 = $300 - 100 = profit $200
    icon: DIAMOND_ORE

  smelt_redstone_ore:
