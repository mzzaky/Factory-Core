# Recipes Configuration
# Format: recipe_id -> inputs & outputs
# money-cost: money deducted from the player each time production starts (0 = free)
# disable-item-output: true (optional) will prevent any items from going to the output storage, useful if you only want to give rewards via console-commands
#
# ==================== VANILLA INPUT PREFIX ====================
# For Smeltery recipes, input keys prefixed with "vanilla:" refer to plain
# vanilla Minecraft materials obtained from the world (e.g. "vanilla:IRON_ORE").
# The engine matches these by Bukkit Material name rather than a plugin resource ID,
# so custom-model-data items with the same material are NOT accepted as substitutes.
# All other input keys (no prefix) refer to plugin-tracked resources in resources.yml.

recipes:
  # ==================== SMELTERY RECIPES ====================
  # The Smeltery is the ENTRY-POINT factory: it accepts real vanilla materials
  # mined / gathered by players and converts them into plugin-tracked raw resources.

  smelt_iron_ore:
    name: "§fIron Ore Processing"
    factory-type: smeltery
    production-time: 120 # seconds
    money-cost: 10.0
    inputs:
      vanilla:IRON_ORE: 4          # 4x Iron Ore block (mined from world)
      vanilla:COAL: 2              # 2x Coal (natural fuel)
    outputs:
      iron_ore: 8                  # yields plugin-tracked iron_ore raw resource
    console-commands:
      - "eco give {player} 20"
    icon: IRON_ORE

  smelt_coal_ore:
